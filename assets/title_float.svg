<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   id="micombinator-logo"
   version="1.1"
   viewBox="0 0 640 100"
   height="100"
   width="640">
  <style>
    #combinator-word {
      animation-name: floating;
      animation-duration: 3s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    @keyframes floating {
      0% { transform: translate(0, 0px); }
      50% { transform: translate(0, -5px); }
      100% { transform: translate(0, 0px); }
    }
    .word-combinator {
      font-family: 'Poppins', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
  </style>
  <defs>
    <linearGradient id="miGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="5%" stop-color="#8B2FE8"/>
      <stop offset="95%" stop-color="#2FA8F0"/>
    </linearGradient>
  </defs>

  <!-- "Mi" mark: original artwork, static (not animated) -->
  <g id="mi-mark" transform="translate(0,0)">
    <path fill="url(#miGradient)" d="
      M 10,88
      C 10,88 10,40 10,30
      C 10,18 19,10 30,10
      C 38,10 43,14 47,21
      L 55,36
      L 63,21
      C 67,14 72,10 80,10
      C 91,10 100,18 100,30
      C 100,40 100,88 100,88
      C 100,94.5 95,99 89,99
      C 83,99 78,94.5 78,88
      L 78,45
      L 66,66
      C 63,71 58,71 55,66
      L 55,66
      C 52,71 47,71 44,66
      L 32,45
      L 32,88
      C 32,94.5 27,99 21,99
      C 15,99 10,94.5 10,88
      Z"/>
    <circle cx="116" cy="20" r="13" fill="url(#miGradient)"/>
    <path fill="url(#miGradient)" d="
      M 103,52
      C 103,45 109,40 116,40
      C 123,40 129,45 129,52
      L 129,88
      C 129,94.5 123.5,99 116,99
      C 109,99 103,94.5 103,88
      Z"/>
  </g>

  <!-- "Combinator" wordmark: this is the part that floats -->
  <g id="combinator-word">
    <text
       x="145"
       y="76"
       font-size="60"
       class="word-combinator"
       fill="url(#miGradient)">Combinator</text>
  </g>
</svg>